# Weekly update pull requests for every kind of dependency. Packages that only
# work together (the React family, the Vite family) always come in ONE pull
# request, even for a major version: upgraded alone they fail CI. Other minor and
# patch updates are grouped per ecosystem; other majors come one by one.
# Updates are applied by Inspiring Ming (not merged as dependabot[bot]), so the
# repository keeps a single contributor.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:  # the first group a package matches wins
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule: { interval: monthly }
