[project]
name = "newsimpact"
version = "0.1.0"
description = "News semantics, source reliability, storylines and market-impact analytics"
readme = "README.md"
authors = [{ name = "Inspiring Ming" }]
license = { text = "Proprietary - (c) Inspiring Ming. All rights reserved." }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",      # RSS feeds + GDELT search
    "defusedxml>=0.7",  # safe RSS/Atom parsing
    "tzdata>=2024.1",   # time zones for trading sessions, also in slim containers
]

[project.urls]
Repository = "https://github.com/Inspiring-Ming/NewsImpact"

[project.optional-dependencies]
anthropic = ["anthropic>=2.8"]  # only for NI_LLM_PRESET=quality or economy

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-defusedxml>=0.7",
    "anthropic>=2.8",  # type-check and test the optional Claude adapter
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsimpact"]

# ---------------------------------------------------------------- quality gates
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"  # tests/<module>/test_service.py may share names
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]

# ------------------------------------------------- architecture boundary rules
# Enforced in CI (`make arch`). Rationale: docs/03-architecture.md, section "Rules".
[tool.importlinter]
root_package = "newsimpact"

[[tool.importlinter.contracts]]
name = "1. shared/ is the base: it imports nothing else from newsimpact"
type = "forbidden"
source_modules = ["newsimpact.shared"]
forbidden_modules = [
    "newsimpact.app", "newsimpact.sources", "newsimpact.semantics", "newsimpact.reliability",
    "newsimpact.storylines", "newsimpact.market", "newsimpact.validation",
    "newsimpact.llm", "newsimpact.alerts", "newsimpact.identity",
]

[[tool.importlinter.contracts]]
name = "2. Modules are independent: they may only use each other's models.py"
type = "independence"
modules = [
    "newsimpact.sources", "newsimpact.semantics", "newsimpact.reliability",
    "newsimpact.storylines", "newsimpact.market", "newsimpact.validation",
    "newsimpact.llm", "newsimpact.alerts", "newsimpact.identity",
]
ignore_imports = ["newsimpact.** -> newsimpact.*.models"]

[[tool.importlinter.contracts]]
name = "3. models.py is pure data: no services, ports, adapters or app"
type = "forbidden"
source_modules = ["newsimpact.*.models"]
forbidden_modules = ["newsimpact.*.service", "newsimpact.*.ports", "newsimpact.*.adapters", "newsimpact.app"]

[[tool.importlinter.contracts]]
name = "4. Business logic never imports technology (adapters, storage) or the app"
type = "forbidden"
source_modules = [
    "newsimpact.*.models", "newsimpact.*.logic", "newsimpact.*.ports", "newsimpact.*.service",
]
forbidden_modules = ["newsimpact.*.adapters", "newsimpact.app", "newsimpact.shared.sqlite"]
